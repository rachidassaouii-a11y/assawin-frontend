<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assawin API Checker</title>
    <style>
        :root {
            --bg-dark-main: #030712;
            --bg-card-glass: rgba(17, 24, 39, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --gold-primary: #f59e0b;
            --gold-secondary: #d97706;
            --gold-light: #fbbf24;
            --text-primary: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-emerald: #10b981;
            --accent-red: #ef4444;
        }
        body {
            background-color: var(--bg-dark-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .glass-card {
            background: var(--bg-card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.15);
        }
        h1 {
            color: var(--gold-primary);
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        button {
            background: linear-gradient(135deg, var(--gold-secondary) 0%, var(--gold-primary) 50%, var(--gold-light) 100%);
            color: var(--bg-dark-main);
            border: none;
            border-radius: 0.5rem;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            margin-bottom: 1.5rem;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        #result {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold-primary);
            min-height: 1.5rem;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Assawin API</h1>
        <p>Vérification de l'état du serveur</p>
        <button onclick="checkAPI()">Tester l'API</button>
        <div id="result">En attente...</div>
    </div>

    <script>
        async function checkAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = "Chargement... (Le serveur peut mettre 30s à démarrer)";
            try {
                const response = await fetch("https://assawin-api-2026.onrender.com/health");
                const data = await response.json();
                // Correction ici : on affiche seulement le statut
                resultDiv.textContent = "Statut : " + data.status;
            } catch (error) {
                resultDiv.textContent = "Erreur : " + error.message;
            }
        }
    </script>
</body>
</html>
