<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assawin API Checker</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #0a192f, #112240); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #233554; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #64ffda; font-size: 24px; margin-bottom: 10px; }
        p { color: #a8b2d1; margin-bottom: 20px; }
        button { background: #64ffda; color: #0a192f; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #48bfe3; }
        #result { margin-top: 20px; padding: 15px; background: #0a192f; border-radius: 8px; font-family: monospace; word-wrap: break-word; }
    </style>
<link rel="stylesheet" href="/assawin-frontend/assets/polish-engine/polish-engine.css">
<script src="/assawin-frontend/assets/polish-engine/polish-engine.js" defer></script>
</head>
<body>
    <div class="card">
        <h1>Assawin API</h1>
        <p>Vérification de l'état du serveur</p>
        <button onclick="checkAPI()">Tester l'API</button>
        <div id="result">En attente...</div>
    </div>

    <script>
        async function checkAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = "Chargement... (Le serveur peut mettre 30s à démarrer)";
            try {
                const response = await fetch('https://assawin-api-2026-v2.onrender.com');
                const data = await response.json();
                // Affiche le JSON reçu de ton backend
                resultDiv.textContent = "Statut : " + data.status + "\nMessage : " + data.message;
            } catch (error) {
                resultDiv.textContent = "Erreur : " + error.message;
            }
        }
    </script>
</body>
</html>
