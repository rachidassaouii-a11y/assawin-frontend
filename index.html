<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl shadow-slate-100 border border-slate-100 overflow-hidden">
  <!-- En-tête de la carte -->
  <div class="px-8 pt-8 pb-6 border-b border-slate-100 bg-gradient-to-r from-slate-900 to-slate-800 text-white">
    <div class="flex items-center justify-between">
      <div>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-400/10 text-amber-400 border border-amber-400/20 mb-3">
          Comptabilité Analytique
        </span>
        <h2 class="text-xl font-bold tracking-tight">Nouvelle Dépense / Affectation</h2>
      </div>
    </div>
  </div>

  <!-- Corps du formulaire -->
  <div class="p-8 space-y-6">
    
    <!-- Étape 1: Choix de la Destination -->
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">1. Destination de la dépense</label>
      <div class="grid grid-cols-2 gap-4">
        <!-- Option Entreprise -->
        <label class="relative flex flex-col p-4 rounded-xl border-2 border-slate-100 cursor-pointer hover:border-amber-500/50 hover:bg-amber-50/30 transition-all group">
          <input type="radio" name="expense_type" value="enterprise" class="peer sr-only">
          <span class="text-sm font-bold text-slate-800">Entreprise / Frais</span>
          <span class="text-xs text-slate-500 mt-0.5">Véhicules, assurances, outillage global</span>
        </label>

        <!-- Option Projet -->
        <label class="relative flex flex-col p-4 rounded-xl border-2 border-slate-100 cursor-pointer hover:border-amber-500/50 hover:bg-amber-50/30 transition-all group">
          <input type="radio" name="expense_type" value="project" class="peer sr-only" checked>
          <span class="text-sm font-bold text-slate-800">Chantier / Projet</span>
          <span class="text-xs text-slate-500 mt-0.5">Matériaux, sous-traitance spécifique</span>
        </label>
      </div>
    </div>

    <!-- Étape 2: Sélection du projet -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">2. Projet concerné (`/projets`)</label>
        <select class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all">
          <option>Sélectionner un chantier actif...</option>
          <option>Rénovation Appartement - Saint-Ouen</option>
          <option>Aménagement Bureaux - Paris 11</option>
        </select>
      </div>
    </div>

    <!-- Bouton d'action -->
    <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
      <button type="button" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-500 hover:bg-slate-100 transition-colors">Annuler</button>
      <button type="button" class="px-6 py-2.5 rounded-xl text-sm font-semibold bg-slate-900 text-white hover:bg-slate-800 shadow-lg shadow-slate-900/20 transition-all">Enregistrer</button>
    </div>

  </div>
</div>
