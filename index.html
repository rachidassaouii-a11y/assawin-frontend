<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assawin API Checker</title>
<link rel="stylesheet" href="/assawin-frontend/assets/polish-engine/polish-engine.css">
<script src="/assawin-frontend/assets/polish-engine/polish-engine.js" defer></script>
</head>
<body>
    <div class="card">
        <h1>Assawin API</h1>
        <p>Vérification de l'état du serveur</p>
        <button onclick="checkAPI()">Tester l'API</button>
        <div id="result">En attente...</div>
    </div>

    <script>
        async function checkAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = "Chargement... (Le serveur peut mettre 30s à démarrer)";
            try {
                const response = await fetch('https://assawin-api-2026-v2.onrender.com');
                const data = await response.json();
                // Affiche le JSON reçu de ton backend
                resultDiv.textContent = "Statut : " + data.status + "\nMessage : " + data.message;
            } catch (error) {
                resultDiv.textContent = "Erreur : " + error.message;
            }
        }
    </script>
</body>
</html>
