<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSAWIN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #101622;
            border-radius: 36px;
            padding: 24px 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            border: 1px solid #1e293b;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
        }

        .logo-symbol {
            color: #f0a500;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .notification-icon {
            background: #192233;
            border: none;
            color: #ffc107;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Top Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: #172133;
            padding: 10px 4px;
            border-radius: 12px;
            border: 1px solid #23314a;
            text-align: center;
        }

        .stat-title {
            font-size: 8.5px;
            color: #8b9bb4;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .stat-value {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Greeting */
        .greeting-section {
            margin-bottom: 20px;
        }

        .greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .greeting-subtitle {
            font-size: 13px;
            color: #8b9bb4;
        }

        /* Action Buttons */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .action-btn {
            background: #172133;
            border: 1px solid #23314a;
            color: white;
            padding: 12px 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn.full-width {
            grid-column: span 2;
        }

        .action-btn:hover {
            background: #1e2b42;
        }

        /* Section Title */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin: 22px 0 12px 0;
            color: #ffffff;
        }

        /* Projects List */
        .project-card {
            background: #172133;
            border: 1px solid #23314a;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .project-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .project-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #23314a;
            object-fit: cover;
        }

        .project-name {
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .project-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 500;
        }

        .tag-actif {
            background: rgba(40, 167, 69, 0.18);
            color: #2ecc71;
        }

        .tag-attente {
            background: rgba(255, 193, 7, 0.18);
            color: #f1c40f;
        }

        .project-budget {
            font-size: 11px;
            color: #8b9bb4;
            margin-top: 5px;
        }

        /* Circular Progress */
        .progress-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: conic-gradient(#f0a500 72%, #23314a 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-circle.p45 {
            background: conic-gradient(#f0a500 45%, #23314a 0);
        }

        .progress-circle::before {
            content: "";
            position: absolute;
            width: 36px;
            height: 36px;
            background: #172133;
            border-radius: 50%;
        }

        .progress-value {
            position: relative;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Bottom Nav */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 25px;
            border-top: 1px solid #1e293b;
            padding-top: 12px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8b9bb4;
            font-size: 10px;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-fab {
            width: 44px;
            height: 44px;
            background: #ffffff;
            color: #101622;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255,255,255,0.25);
            margin-top: -12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div style="width: 38px;"></div>
            <div class="logo-area">
                <span class="logo-symbol">A</span>
                <span class="logo-text">ASSAWIN</span>
            </div>
            <button class="notification-icon">🔔</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">CA Total</div>
                <div class="stat-value">218 400 €</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Marge Brute</div>
                <div class="stat-value">18 750 €</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Taux de Marque</div>
                <div class="stat-value">44,5%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Chantiers</div>
                <div class="stat-value">8</div>
            </div>
        </div>

        <div class="greeting-section">
            <div class="greeting">Bonjour 👋 Rachid</div>
            <div class="greeting-subtitle">Que souhaitez-vous faire ?</div>
        </div>

        <div class="actions-grid">
            <button class="action-btn">➕ Nouveau devis</button>
            <button class="action-btn">🏗️ Nouveau chantier</button>
            <button class="action-btn full-width">📄 Scanner facture</button>
        </div>

        <div class="section-title">Mes chantiers</div>

        <div class="project-card">
            <div class="project-info">
                <div class="project-img" style="background: linear-gradient(135deg, #2b3a55, #172133);"></div>
                <div>
                    <div class="project-name">Rénovation Appretent</div>
                    <div><span class="project-tag tag-actif">Actif</span></div>
                    <div class="project-budget">Budget : 85 000 €</div>
                </div>
            </div>
            <div class="progress-circle">
                <span class="progress-value">72%</span>
            </div>
        </div>

        <div class="project-card">
            <div class="project-info">
                <div class="project-img" style="background: linear-gradient(135deg, #354a3e, #172133);"></div>
                <div>
                    <div class="project-name">Villa Modeme</div>
                    <div><span class="project-tag tag-attente">En attente</span></div>
                    <div class="project-budget">Budget : 124 000 €</div>
                </div>
            </div>
            <div class="progress-circle p45">
                <span class="progress-value">45%</span>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active">
                <span>🏠</span>
                <span>Accueil</span>
            </button>
            <button class="nav-item">
                <span>💬</span>
                <span>Chantiers</span>
            </button>
            <div class="nav-fab">+</div>
            <button class="nav-item">
                <span>📊</span>
                <span>Pilotage</span>
            </button>
            <button class="nav-item">
                <span>👤</span>
                <span>Compte</span>
            </button>
        </div>
    </div>

</body>
</html>
