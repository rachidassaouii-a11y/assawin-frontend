<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASSAWIN — Pilotage GROUPE ARTS</title>
<style>
:root {
    --bg-main: #0c0d0f;
    --surface: #16181d;
    --surface-card: #1e2128;
    --border-color: rgba(245, 158, 11, 0.15);
    --gold: #f59e0b;
    --text-main: #f1f3f5;
    --text-muted: #94a3b8;
    --red: #f87171;
}
* { box-sizing: border-box; }
body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    padding-bottom: 70px;
}
header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border-color);
}
.logo-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); margin: 0; }
.logo-sub { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.avatar { width: 32px; height: 32px; background: var(--gold); color: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }

.container { max-width: 600px; margin: 0 auto; padding: 16px; }

.card {
    background: var(--surface); border: 1px solid var(--border-color);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
}
.card-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 12px; font-weight: 700; }

.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }

label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; text-transform: uppercase; }
input, textarea, select {
    width: 100%; padding: 10px; background: var(--surface-card);
    border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.9rem;
}
input:focus, textarea:focus { outline: none; border-color: var(--gold); }

.btn {
    width: 100%; padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; border: none; text-align: center; background: var(--gold); color: #000;
    text-transform: uppercase; letter-spacing: 0.05em;
}
.btn-secondary { background: var(--surface-card); color: var(--text-main); border: 1px solid var(--border-color); margin-top: 6px; }

.item-list { background: var(--surface-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
.item-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
.item-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }

.nav-bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; padding: 10px 0;
}
.nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
.nav-btn.active { color: var(--gold); font-weight: 700; }

.section { display: none; }
.section.active { display: block; }
</style>
</head>
<body>

<header>
    <div>
        <h1 class="logo-title">ASSAWIN</h1>
        <div class="logo-sub">Groupe Arts — Pilotage</div>
    </div>
    <div class="avatar">RA</div>
</header>

<div class="container">

    <!-- SECTION 0 : POINT QUOTIDIEN & OBJECTIFS -->
    <div class="section active" id="sec-0">
        <div class="card">
            <div class="card-title">Point Quotidien et Trajectoire</div>
            
            <label>Date</label>
            <input type="date" id="pt-date" />

            <div class="grid-2" style="margin-top:10px;">
                <div>
                    <label>Bilan J-1</label>
                    <textarea id="pt-j1" rows="2" placeholder="Réalisations, faits marquants..."></textarea>
                </div>
                <div>
                    <label>Prévision J+1</label>
                    <textarea id="pt-jplus1" rows="2" placeholder="Priorités du lendemain..."></textarea>
                </div>
            </div>

            <div class="grid-3">
                <div>
                    <label>Objectif M-1</label>
                    <input type="number" id="pt-m1" placeholder="0" />
                </div>
                <div>
                    <label>Objectif Mois</label>
                    <input type="number" id="pt-mois" placeholder="0" />
                </div>
                <div>
                    <label>Objectif Annuel</label>
                    <input type="number" id="pt-an" placeholder="0" />
                </div>
            </div>

            <button class="btn" onclick="savePoint()">Enregistrer le point</button>
        </div>

        <div class="card-title" style="margin-top:16px;">Historique des points</div>
        <div id="points-container"></div>
    </div>

    <!-- SECTION 1 : CLIENTS / PROSPECTS -->
    <div class="section" id="sec-1">
        <div class="card">
            <div class="card-title">Nouveau Contact</div>
            <label>Nom ou Raison Sociale</label>
            <input type="text" id="cli-nom" placeholder="Nom du client ou prospect" />
            <div class="grid-2" style="margin-top:10px;">
                <div>
                    <label>Statut</label>
                    <select id="cli-type"><option value="Prospect">Prospect</option><option value="Client">Client</option></select>
                </div>
                <div>
                    <label>Telephone</label>
                    <input type="tel" id="cli-tel" placeholder="06..." />
                </div>
            </div>
            <button class="btn" onclick="saveClient()">Ajouter au CRM</button>
        </div>
        <div id="clients-container"></div>
    </div>

    <!-- SECTION 2 : CHANTIERS -->
    <div class="section" id="sec-2">
        <div class="card">
            <div class="card-title">Nouveau Chantier</div>
            <label>Intitule</label>
            <input type="text" id="proj-nom" placeholder="Nom du chantier" />
            <div class="grid-2" style="margin-top:10px;">
                <div>
                    <label>Budget HT</label>
                    <input type="number" id="proj-budget" value="0" />
                </div>
                <div>
                    <label>Marge %</label>
                    <input type="number" id="proj-marge" value="30" />
                </div>
            </div>
            <button class="btn" onclick="saveProject()">Enregistrer le chantier</button>
        </div>
        <div id="projets-container"></div>
    </div>

</div>

<nav class="nav-bottom">
    <button class="nav-btn active" onclick="switchTab(0, this)">Pilotage</button>
    <button class="nav-btn" onclick="switchTab(1, this)">Contacts</button>
    <button class="nav-btn" onclick="switchTab(2, this)">Chantiers</button>
</nav>

<script>
let db = {
    points: JSON.parse(localStorage.getItem('as_points') || '[]'),
    clients: JSON.parse(localStorage.getItem('as_clients') || '[]'),
    projets: JSON.parse(localStorage.getItem('as_projets') || '[]')
};

document.getElementById('pt-date').value = new Date().toISOString().slice(0,10);

function switchTab(idx, btn) {
    document.querySelectorAll('.section').forEach((s, i) => s.classList.toggle('active', i === idx));
    document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    window.scrollTo({top:0, behavior:'smooth'});
}

function saveData() {
    localStorage.setItem('as_points', JSON.stringify(db.points));
    localStorage.setItem('as_clients', JSON.stringify(db.clients));
    localStorage.setItem('as_projets', JSON.stringify(db.projets));
    render();
}

function savePoint() {
    const date = document.getElementById('pt-date').value;
    const j1 = document.getElementById('pt-j1').value;
    const jplus1 = document.getElementById('pt-jplus1').value;
    const m1 = document.getElementById('pt-m1').value;
    const mois = document.getElementById('pt-mois').value;
    const an = document.getElementById('pt-an').value;
    
    db.points.unshift({date, j1, jplus1, m1, mois, an});
    saveData();
}

function saveClient() {
    const nom = document.getElementById('cli-nom').value;
    const type = document.getElementById('cli-type').value;
    const tel = document.getElementById('cli-tel').value;
    if(!nom) return;
    db.clients.unshift({nom, type, tel});
    saveData();
    document.getElementById('cli-nom').value = '';
    document.getElementById('cli-tel').value = '';
}

function saveProject() {
    const nom = document.getElementById('proj-nom').value;
    const budget = document.getElementById('proj-budget').value;
    const marge = document.getElementById('proj-marge').value;
    if(!nom) return;
    db.projets.unshift({nom, budget, marge});
    saveData();
    document.getElementById('proj-nom').value = '';
}

function render() {
    document.getElementById('points-container').innerHTML = db.points.map(p => `
        <div class="item-list">
            <div class="item-header"><span>Date : ${p.date}</span></div>
            <div class="item-text">J-1 : ${p.j1 || '-'}</div>
            <div class="item-text">J+1 : ${p.jplus1 || '-'}</div>
            <div class="item-text" style="margin-top:4px; color:var(--gold);">M-1: ${p.m1} | Mois: ${p.mois} | Année: ${p.an}</div>
        </div>
    `).join('') || '<div class="item-text">Aucun point enregistré.</div>';

    document.getElementById('clients-container').innerHTML = db.clients.map(c => `
        <div class="item-list">
            <div class="item-header"><span>${c.nom}</span><span>${c.type}</span></div>
            <div class="item-text">${c.tel || ''}</div>
        </div>
    `).join('') || '<div class="item-text">Aucun contact.</div>';

    document.getElementById('projets-container').innerHTML = db.projets.map(pr => `
        <div class="item-list">
            <div class="item-header"><span>${pr.nom}</span><span>${pr.budget} EUR HT</span></div>
            <div class="item-text">Marge cible : ${pr.marge}%</div>
        </div>
    `).join('') || '<div class="item-text">Aucun chantier.</div>';
}

render();
</script>
</body>
</html>
