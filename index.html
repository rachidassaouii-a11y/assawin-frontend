<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASSAWIN — Mobile Cockpit</title>
<style>
:root {
  --bg: #06111f;
  --panel: #0d2239;
  --panel-card: #112b47;
  --line: rgba(170, 195, 220, 0.15);
  --text: #eef5fb;
  --muted: #91a4b8;
  --gold: #f4b74f;
  --orange: #ff923d;
  --green: #24b985;
  --blue: #57a7ff;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: #030a13;
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  padding-bottom: 100px;
}

.app {
  min-height: 100vh;
  background: radial-gradient(circle at 80% 0, rgba(47,112,180,0.18), transparent 28%),
              linear-gradient(155deg, #081728, #07111f 55%, #030a13);
}

.shell {
  max-width: 920px;
  margin: auto;
  padding: 12px 16px 28px;
}

/* HEADER */
.top {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: Georgia, serif;
  font-size: 24px;
  letter-spacing: 0.14em;
  font-weight: bold;
}
.brand b {
  color: var(--gold);
  font-size: 30px;
}
.icon-btn {
  background: none;
  border: 0;
  color: #dce8f4;
  font-size: 24px;
  cursor: pointer;
  padding: 8px;
}

/* MONEY COCKPIT */
.cockpit-title {
  margin: 20px 0 10px;
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.kpi {
  background: linear-gradient(145deg, #102b47, #091b2e);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.22);
}
.kpi small {
  display: block;
  color: #a9b8c8;
  text-transform: uppercase;
  font-size: 9px;
  font-weight: 800;
}
.kpi strong {
  display: block;
  font-size: 18px;
  margin-top: 6px;
  white-space: nowrap;
}
.bar {
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--orange), var(--gold));
  margin-top: 10px;
}
.kpi:nth-child(2) .bar { background: linear-gradient(90deg, var(--gold), var(--green), var(--blue)); }
.kpi:nth-child(4) .bar { background: var(--blue); }

/* ACTIONS RAPIDES */
.section-label {
  font-size: 18px;
  font-weight: 700;
  margin: 20px 0 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.quick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}
.quick button {
  border: 1px solid var(--line);
  background: linear-gradient(145deg, #112b47, #0a1d30);
  color: white;
  border-radius: 15px;
  padding: 16px;
  text-align: left;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.quick button:last-child {
  grid-column: 1 / -1;
}
.quick button:hover {
  border-color: rgba(244, 183, 79, 0.45);
}

/* MES CHANTIERS */
.projects {
  display: grid;
  gap: 12px;
  margin-top: 10px;
}
.project {
  display: grid;
  grid-template-columns: 72px 1fr 80px;
  gap: 12px;
  align-items: center;
  background: linear-gradient(135deg, #112b47, #091a2c);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.2);
}
.thumb {
  width: 72px;
  height: 72px;
  border-radius: 12px;
  overflow: hidden;
  background: #18334c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.project h3 {
  margin: 0 0 6px;
  font-size: 16px;
}
.meta {
  font-size: 13px;
  color: #bdc9d5;
}
.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(36,185,133,0.16);
  color: #67dda9;
  font-weight: 800;
  font-size: 11px;
  margin-right: 6px;
}
.wait {
  background: rgba(244,183,79,0.15);
  color: #ffc966;
}
.ring {
  --p: 70;
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: conic-gradient(var(--gold) calc(var(--p)*1%), rgba(255,255,255,0.08) 0);
  display: grid;
  place-items: center;
}
.ring div {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #0a1c2f;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 15px;
}

/* NAVIGATION BASSE */
.bottom {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 920px);
  height: 80px;
  background: rgba(4, 12, 21, 0.95);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  backdrop-filter: blur(16px);
  z-index: 10;
}
.nav {
  background: none;
  border: 0;
  color: #8ea2b6;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.nav.active { color: #fff; }
.nav span:first-child { font-size: 18px; }
.plus {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 1px solid rgba(170,205,240,0.3);
  background: linear-gradient(145deg, #19476e, #0b2138);
  color: white;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -20px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.4);
}

/* MODALES & TOAST */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 14px;
  z-index: 20;
}
.modal.open { display: flex; }
.sheet {
  width: min(100%, 620px);
  background: #0c2036;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
}
.sheet h2 { margin-top: 0; }
.field { display: grid; gap: 6px; margin: 12px 0; }
.field label { font-size: 12px; color: #aab9c8; }
.field input, .field textarea {
  background: #061424;
  color: white;
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 11px;
  font-size: 14px;
}
.actions { display: flex; gap: 10px; margin-top: 20px; }
.btn {
  border: 0;
  padding: 13px 17px;
  border-radius: 11px;
  font-weight: 800;
  cursor: pointer;
  flex: 1;
}
.primary { background: linear-gradient(90deg, var(--orange), var(--gold)); color: #121820; }
.secondary { background: #173552; color: #e6eff8; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 95px;
  transform: translateX(-50%);
  background: #15324e;
  border: 1px solid var(--line);
  padding: 12px 18px;
  border-radius: 13px;
  display: none;
  z-index: 30;
  font-size: 13px;
}

@media(max-width: 650px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi strong { font-size: 16px; }
}
</style>
</head>
<body>

<div class="app">
  <main class="shell">

    <!-- HEADER -->
    <header class="top">
      <button class="icon-btn" onclick="showToast('Menu de navigation')">☰</button>
      <div class="brand"><b>ᐃ</b> ASSAWIN</div>
      <button class="icon-btn" onclick="showToast('Aucune nouvelle notification')">🔔</button>
    </header>

    <!-- MONEY COCKPIT -->
    <div class="cockpit-title">MONEY COCKPIT</div>
    <section class="kpis">
      <div class="kpi">
        <small>CA Total</small>
        <strong id="ca">—</strong>
        <div class="bar"></div>
      </div>
      <div class="kpi">
        <small>Marge Brute</small>
        <strong id="margin">—</strong>
        <div class="bar"></div>
      </div>
      <div class="kpi">
        <small>Taux de Marque</small>
        <strong id="rate">—</strong>
        <div class="bar"></div>
      </div>
      <div class="kpi">
        <small>Chantiers Actifs</small>
        <strong id="active">—</strong>
        <div class="bar"></div>
      </div>
    </section>

    <!-- ACTIONS RAPIDES -->
    <div class="section-label">Actions Rapides</div>
    <section class="quick">
      <button onclick="openModal('quote')"><span>▣</span> Nouveau Devis</button>
      <button onclick="openModal('project')"><span>▥</span> Nouveau Chantier</button>
      <button onclick="showToast('Scanner facture : module OCR en cours d\'intégration')"><span>▦</span> Scanner Facture</button>
    </section>

    <!-- MES CHANTIERS -->
    <div class="section-label">
      Mes Chantiers
      <span id="count" style="font-size:12px; color:var(--muted); font-weight:normal;">Chargement…</span>
    </div>
    <section class="projects" id="projects"></section>

  </main>
</div>

<!-- NAVIGATION BASSE -->
<nav class="bottom">
  <button class="nav active" onclick="showToast('Accueil')"><span>⌂</span><span>Accueil</span></button>
  <button class="nav" onclick="showToast('Liste des Chantiers')"><span>▥</span><span>Chantiers</span></button>
  <button class="nav" onclick="openModal('project')"><span class="plus">+</span><span>Créer</span></button>
  <button class="nav" onclick="showToast('Pilotage & Marges')"><span>📊</span><span>Pilotage</span></button>
  <button class="nav" onclick="showToast('Mon Compte')"><span>👤</span><span>Compte</span></button>
</nav>

<!-- MODALE CHANTIER -->
<div class="modal" id="project-modal">
  <div class="sheet">
    <h2>Nouveau chantier</h2>
    <div class="field"><label>Nom du projet</label><input id="p-name" placeholder="Ex: Rénovation Appartement"></div>
    <div class="field"><label>Budget HT (€)</label><input id="p-budget" type="number" placeholder="85000"></div>
    <div class="field"><label>Marge cible (%)</label><input id="p-margin" type="number" value="30"></div>
    <div class="field"><label>Description</label><textarea id="p-desc" rows="2"></textarea></div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('project')">Annuler</button>
      <button class="btn primary" onclick="createProject()">Créer</button>
    </div>
  </div>
</div>

<!-- MODALE DEVIS -->
<div class="modal" id="quote-modal">
  <div class="sheet">
    <h2>Nouveau devis (Simulation)</h2>
    <div class="field"><label>Prix de vente HT (€)</label><input id="q-total" type="number" placeholder="10000"></div>
    <div class="field"><label>Coût total estimé (€)</label><input id="q-cost" type="number" placeholder="7000"></div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('quote')">Annuler</button>
      <button class="btn primary" onclick="calculateQuote()">Calculer Marge</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://assawin-backend.onrender.com";
const TOKEN = localStorage.getItem("assawin_token") || "";

const demoProjects = [
  { id: "demo1", nom_projet: "Rénovation Appartement", statut: "EN_COURS", budget_initial_ht: 85000, marge_cible_pct: 72, img: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=240&q=80" },
  { id: "demo2", nom_projet: "Villa Moderne", statut: "EN_ATTENTE", budget_initial_ht: 120000, marge_cible_pct: 45, img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=240&q=80" }
];

const eur = v => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(Number(v || 0));

function showToast(msg) {
  const x = document.getElementById("toast");
  x.textContent = msg;
  x.style.display = "block";
  clearTimeout(window.tTimer);
  window.tTimer = setTimeout(() => x.style.display = "none", 3000);
}

function openModal(n) { document.getElementById(n + "-modal").classList.add("open"); }
function closeModal(n) { document.getElementById(n + "-modal").classList.remove("open"); }

async function api(path, opt = {}) {
  let r = await fetch(API + path, {
    ...opt,
    headers: {
      accept: "application/json",
      ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}),
      ...(opt.headers || {})
    }
  });
  if (!r.ok) throw Error(r.status);
  return r.json();
}

function renderProjects(list) {
  document.getElementById("count").textContent = list.length + " chantier" + (list.length > 1 ? "s" : "");
  document.getElementById("projects").innerHTML = list.map(p => {
    let active = (p.statut || "").includes("COURS");
    let pct = Math.max(0, Math.min(100, p.marge_cible_pct ?? 30));
    return `
      <article class="project">
        <div class="thumb">${p.img ? `<img src="${p.img}">` : "🏗️"}</div>
        <div>
          <h3>${p.nom_projet || "Chantier ASSAWIN"}</h3>
          <div class="meta">
            <span class="badge ${active ? "" : "wait"}">${active ? "Actif" : "En attente"}</span>
            ${eur(p.budget_initial_ht || 0)}
          </div>
        </div>
        <div class="ring" style="--p:${pct}">
          <div>${pct}%</div>
        </div>
      </article>`;
  }).join("");
}

async function loadData() {
  try {
    let d = await api("/api/v1/dashboard/summary");
    document.getElementById("ca").textContent = eur(d.chiffre_affaires_total);
    document.getElementById("margin").textContent = eur(d.marge_brute_eur);
    document.getElementById("rate").textContent = (d.taux_marque_pct || 0) + "%";
    document.getElementById("active").textContent = d.chantiers_en_cours ?? d.nombre_projets ?? 0;
  } catch (e) {
    document.getElementById("ca").textContent = eur(205000);
    document.getElementById("margin").textContent = eur(58000);
    document.getElementById("rate").textContent = "28%";
    document.getElementById("active").textContent = "2";
  }

  try {
    let p = await api("/api/v1/projets/");
    renderProjects(Array.isArray(p) ? p : (p.projets || demoProjects));
  } catch (e) {
    renderProjects(demoProjects);
  }
}

async function createProject() {
  let p = {
    nom_projet: document.getElementById("p-name").value,
    budget_initial_ht: Number(document.getElementById("p-budget").value || 0),
    marge_cible_pct: Number(document.getElementById("p-margin").value || 30),
    description: document.getElementById("p-desc").value || null
  };
  if (!p.nom_projet) return showToast("Nom du chantier obligatoire");

  try {
    await api("/api/v1/projets/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(p)
    });
    closeModal("project");
    showToast("Chantier créé avec succès");
    loadData();
  } catch (e) {
    closeModal("project");
    showToast("Mode hors-ligne : Chantier simuler localement");
    demoProjects.unshift({
      id: "demo_" + Date.now(),
      nom_projet: p.nom_projet,
      statut: "EN_COURS",
      budget_initial_ht: p.budget_initial_ht,
      marge_cible_pct: p.marge_cible_pct
    });
    renderProjects(demoProjects);
  }
}

function calculateQuote() {
  let total = Number(document.getElementById("q-total").value || 0);
  let cost = Number(document.getElementById("q-cost").value || 0);
  closeModal("quote");
  if (total > 0) {
    let diff = total - cost;
    let pct = Math.round((diff / total) * 100);
    showToast(`Marge estimée : ${eur(diff)} (${pct}%)`);
  }
}

loadData();
</script>
</body>
</html>
