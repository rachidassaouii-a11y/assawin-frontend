<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSAWIN Wallet</title>
    <style>
        :root {
            --bg-dark-main: #030712;
            --bg-card-glass: rgba(17, 24, 39, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --gold-primary: #f59e0b;
            --gold-secondary: #d97706;
            --gold-light: #fbbf24;
            --text-primary: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-emerald: #10b981;
            --accent-red: #ef4444;
        }
        body {
            background-color: var(--bg-dark-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            color: var(--gold-primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .glass-card {
            background: var(--bg-card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.15);
        }
        .kpi-card {
            text-align: center;
        }
        .kpi-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .kpi-card .value {
            color: var(--gold-primary);
            font-size: 2rem;
            font-weight: bold;
        }
        .section-title {
            color: var(--gold-primary);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            margin-top: 2rem;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-secondary) 0%, var(--gold-primary) 50%, var(--gold-light) 100%);
            color: var(--bg-dark-main);
            border: none;
            border-radius: 0.5rem;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            margin-top: 1rem;
        }
        .btn-gold:hover {
            opacity: 0.9;
        }
        .btn-gold:active {
            transform: scale(0.98);
        }
        #result {
            color: var(--gold-primary);
            font-weight: bold;
            margin-top: 1rem;
            text-align: center;
        }
        @media (hover: none) and (pointer: coarse) {
            .kpi-card { transform: none !important; }
            .kpi-card:active {
                transform: scale(0.98) !important;
                box-shadow: 0 0 12px rgba(245, 158, 11, 0.3) !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ASSAWIN Wallet</h1>
            <p>Vue consolidée de votre activité</p>
        </div>

        <div class="kpi-grid">
            <div class="glass-card kpi-card">
                <h3>CA Analysé</h3>
                <div class="value" id="ca">—</div>
            </div>
            <div class="glass-card kpi-card">
                <h3>Marge Brute</h3>
                <div class="value" id="marge">—</div>
            </div>
            <div class="glass-card kpi-card">
                <h3>Exposition</h3>
                <div class="value" id="exposition">—</div>
            </div>
            <div class="glass-card kpi-card">
                <h3>Alertes Actives</h3>
                <div class="value" id="alertes">—</div>
            </div>
        </div>

        <div class="section-title">Dernières opérations</div>
        <div class="glass-card" id="operations">
            <p style="color: var(--text-muted);">Chargement en cours...</p>
        </div>

        <button class="btn-gold" onclick="loadData()">Actualiser les données</button>
        <div id="result"></div>
    </div>

    <script>
        async function loadData() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = "Chargement... (Le serveur peut mettre 30s à démarrer)";
            try {
                const response = await fetch("https://assawin-api-2026.onrender.com/health");
                const data = await response.json();
                // Affichage des valeurs simulées pour le Wallet
                // (à remplacer par les vrais endpoints API quand ils seront prêts)
                document.getElementById('ca').textContent = "125 000 €";
                document.getElementById('marge').textContent = "32 500 €";
                document.getElementById('exposition').textContent = "8,5 %";
                document.getElementById('alertes').textContent = "3";
                
                document.getElementById('operations').innerHTML = `
                    <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-glass);">
                        <span>Devis #DEV-2024-001</span>
                        <span style="color: var(--accent-emerald);">Validé</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-glass);">
                        <span>Devis #DEV-2024-002</span>
                        <span style="color: var(--accent-red);">Bloqué</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; padding:10px 0;">
                        <span>Devis #DEV-2024-003</span>
                        <span style="color: var(--gold-primary);">En attente</span>
                    </div>
                `;
                
                resultDiv.textContent = "Statut : " + data.status;
            } catch (error) {
                resultDiv.textContent = "Erreur : " + error.message;
            }
        }
        // Appel initial (retiré pour éviter le chargement automatique)
        // loadData();
    </script>
</body>
</html>
